name: Explorer gates

on:
  pull_request:
  # Only integration branches on push: a PR branch is already covered by
  # pull_request, and running both doubles every check on the same commits.
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Provision locked Rust toolchain and dependencies
        shell: bash
        run: |
          mkdir -p artifacts/setup
          # rustup reads the exact version and components in rust-toolchain.toml.
          set -o pipefail
          rustup show active-toolchain 2>&1 | tee artifacts/setup/rustup.log
          cargo fetch --locked 2>&1 | tee artifacts/setup/cargo-fetch.log
      - name: Run G Rust gates
        run: scripts/check.sh rust
      - name: Retain Rust evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-gates-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/setup/
            artifacts/check/**/*.log
            artifacts/check/**/*.sha256
          retention-days: 14
          if-no-files-found: error

  frontend:
    name: Frontend gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.node-version
      - name: Locked install and Chromium
        working-directory: frontend
        shell: bash
        run: |
          mkdir -p ../artifacts/setup
          set -o pipefail
          npm ci 2>&1 | tee ../artifacts/setup/npm-ci.log
          npx playwright install --with-deps chromium 2>&1 | tee ../artifacts/setup/chromium.log
      - name: Run G frontend gates
        run: scripts/check.sh frontend
      - name: Retain frontend evidence and Playwright traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-gates-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/setup/
            artifacts/check/**/*.log
            artifacts/check/**/*.sha256
            frontend/test-results/
            frontend/playwright-report/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
