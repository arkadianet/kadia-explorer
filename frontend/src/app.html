<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)" />
		<link
			rel="preload"
			href="/fonts/manrope-latin-var.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// The theme follows the operating system unless the header toggle has been used, in
			// which case the saved choice wins. Applied before first paint so a dark-mode visitor
			// never sees a white flash. Keep this rule in step with $lib/theme/theme.svelte.ts.
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem('xp-theme');
				} catch (e) {
					/* private mode */
				}
				var system =
					window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
				document.documentElement.dataset.theme =
					saved === 'light' || saved === 'dark' ? saved : system;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
