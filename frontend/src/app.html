<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Dark is this explorer's default, not the system's: the UI is designed dark first, so
			// `prefers-color-scheme` is deliberately not consulted. Only an explicit choice from the
			// header toggle (persisted as `xp-theme`) selects light. Keep this rule in step with
			// $lib/theme/theme.svelte.ts.
			(function () {
				try {
					var saved = localStorage.getItem('xp-theme');
					document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
